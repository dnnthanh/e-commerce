apiVersion: apps/v1
kind: Deployment
metadata:
  name: be-payment-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: be-payment-simulator
  template:
    metadata:
      labels:
        app: be-payment-simulator
    spec:
      containers:
        - name: be-payment-simulator
          image: marketplace/be-payment-simulator:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: be-payment-simulator-config
            - secretRef:
                name: be-payment-simulator-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
