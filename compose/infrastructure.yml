name: e-commerce-marketplace
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketplace_admin
      POSTGRES_PASSWORD: marketplace_admin_password
      POSTGRES_DB: postgres
    ports:
    - 5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U marketplace_admin -d postgres]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
    - marketplace
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
    - 3306:3306
    volumes:
    - mysql-data:/var/lib/mysql
    - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
    - marketplace
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Marketplace!2026
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: '1536'
    ports:
    - 1433:1433
    volumes:
    - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null || exit 1]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 20s
    networks:
    - marketplace
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: Marketplace!2026
    entrypoint:
    - /bin/bash
    - /init/run-init.sh
    volumes:
    - ./infrastructure/sqlserver/init:/init:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle_password
      APP_USER: marketplace
      APP_USER_PASSWORD: marketplace_password
    ports:
    - 1521:1521
    volumes:
    - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [CMD, healthcheck.sh]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    networks:
    - marketplace
    profiles:
    - heavy
    - full
    - seed-large
  mongo:
    image: mongo:8.0
    command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    ports:
    - 27017:27017
    volumes:
    - mongo-data:/data/db
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval "db.adminCommand({ping:1}).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
    - marketplace
    profiles:
    - full
    - seed-large
  mongo-init:
    image: mongo:8.0
    entrypoint:
    - bash
    - -lc
    - mongosh --host mongo:27017 /init/init-replica.js && until mongosh --host mongo:27017 --quiet --eval "rs.status().myState" | grep -q 1; do sleep 2; done
    volumes:
    - ./infrastructure/mongodb/init:/init:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
    profiles:
    - full
    - seed-large
  redis:
    image: redis:7.4-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
    - marketplace
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_JMX_PORT: '9999'
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_JMX_OPTS: -Djava.rmi.server.hostname=kafka -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
    - 29092:29092
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 40
    networks:
    - marketplace
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
    - 8185:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: marketplace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
    - 9200:9200
    volumes:
    - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 40
    networks:
    - marketplace
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    ports:
    - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  opensearch-init:
    image: curlimages/curl:8.12.1
    entrypoint:
    - sh
    - -c
    - 'curl -fsS -XPUT -H "Content-Type: application/json" --data-binary @/config/product-index-template.json http://opensearch:9200/_index_template/marketplace-products
      && curl -fsS -XPUT http://opensearch:9200/marketplace-products-v1 || true'
    volumes:
    - ./infrastructure/opensearch/product-index-template.json:/config/product-index-template.json:ro
    depends_on:
      opensearch:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  minio:
    image: quay.io/minio/minio:latest
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: marketplace
      MINIO_ROOT_PASSWORD: marketplace-secret
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio-data:/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
    - marketplace
  imgproxy:
    image: darthsim/imgproxy:latest
    ports:
    - 8186:8080
    environment:
      IMGPROXY_BIND: 0.0.0.0:8080
      IMGPROXY_USE_S3: 'true'
      AWS_ACCESS_KEY_ID: marketplace
      AWS_SECRET_ACCESS_KEY: marketplace-secret
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    networks:
    - marketplace
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
    - start-dev
    - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8180
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    ports:
    - 8180:8080
    volumes:
    - ./infrastructure/keycloak/realm-marketplace.json:/opt/keycloak/data/import/realm-marketplace.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
    - marketplace
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.0
    entrypoint:
    - /bin/bash
    - /bootstrap/bootstrap-internal-client.sh
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_REALM: marketplace
      SERVICE_CLIENT_ID: marketplace-internal
    volumes:
    - ./infrastructure/keycloak:/bootstrap:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  alloy:
    image: grafana/alloy:v1.18.0
    command:
    - run
    - /etc/alloy/config.alloy
    - --server.http.listen-addr=0.0.0.0:12345
    ports:
    - 12345:12345
    volumes:
    - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      lgtm:
        condition: service_started
    networks:
    - marketplace
    profiles:
    - observability
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
    - 8978:8978
    volumes:
    - cloudbeaver-data:/opt/cloudbeaver/workspace
    networks:
    - marketplace
    profiles:
    - observability
  lgtm:
    image: grafana/otel-lgtm:0.29.2
    ports:
    - 3000:3000
    - 9090:9090
    - 3100:3100
    - 3200:3200
    - 4317:4317
    - 4318:4318
    - 4040:4040
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=15d
    volumes:
    - ./infrastructure/lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    - ./infrastructure/prometheus/rules:/otel-lgtm/prometheus-rules:ro
    - ./infrastructure/prometheus/targets:/otel-lgtm/prometheus-targets:ro
    - ./infrastructure/grafana/provisioning/dashboards/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/marketplace.yml:ro
    - ./infrastructure/grafana/dashboards:/otel-lgtm/grafana/dashboards/marketplace:ro
    - lgtm-data:/data
    networks:
    - marketplace
    profiles:
    - observability
  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
    - 9093:9093
    volumes:
    - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
    - marketplace
    profiles:
    - observability
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
    - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  kafka-jmx-exporter:
    build:
      context: ./infrastructure/kafka/jmx-exporter
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: marketplace_admin
      DATA_SOURCE_PASS: marketplace_admin_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  mysql-exporter:
    image: prom/mysqld-exporter:v0.19.0
    command:
    - --config.my-cnf=/cfg/.my.cnf
    volumes:
    - ./infrastructure/mysql/exporter/.my.cnf:/cfg/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  mongodb-exporter:
    image: percona/mongodb_exporter:0.51.0
    command:
    - --mongodb.uri=mongodb://mongo:27017/admin?replicaSet=rs0
    - --collect-all
    depends_on:
      mongo:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - full
  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  mssql-exporter:
    image: awaragi/prometheus-mssql-exporter:v1.3.0
    environment:
      SERVER: sqlserver
      PORT: '1433'
      USERNAME: sa
      PASSWORD: Marketplace!2026
      ENCRYPT: 'true'
      TRUST_SERVER_CERTIFICATE: 'true'
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  oracle-exporter:
    build:
      context: ./infrastructure/oracle-exporter
    command:
    - --config.file=/config/config.yaml
    volumes:
    - ./infrastructure/oracle-exporter/config.yaml:/config/config.yaml:ro
    depends_on:
      oracle:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - full
  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    command:
    - --es.uri=http://opensearch:9200
    - --es.all
    - --es.indices
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    devices:
    - /dev/kmsg:/dev/kmsg
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    networks:
    - marketplace
    profiles:
    - observability
  node-exporter:
    image: prom/node-exporter:v1.11.1
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/rootfs
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    networks:
    - marketplace
    profiles:
    - observability
  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    command:
    - --config.file=/config/blackbox.yml
    volumes:
    - ./infrastructure/blackbox/blackbox.yml:/config/blackbox.yml:ro
    networks:
    - marketplace
    profiles:
    - observability
volumes:
  cloudbeaver-data: {}
  kafka-data: {}
  lgtm-data: {}
  minio-data: {}
  mongo-data: {}
  mysql-data: {}
  opensearch-data: {}
  oracle-data: {}
  postgres-data: {}
  redis-data: {}
  sqlserver-data: {}
networks:
  marketplace:
    name: marketplace-network
