      be-review-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-sqlserver-large:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles:
    - seed-large
    environment:
      MSSQL_SA_PASSWORD: Marketplace!2026
    entrypoint:
    - /bin/bash
    - -lc
    - 'set -e

      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d order_db -i /seed/order-large.sql

      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d fulfillment_db -i /seed/fulfillment-large.sql

      '
    volumes:
    - ./data/seed-large/sqlserver:/seed:ro
    depends_on:
      be-order-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-oracle-large:
    image: gvenzl/oracle-free:23-slim-faststart
    profiles:
    - seed-large
    entrypoint:
    - /bin/bash
    - -lc
    - echo exit | sqlplus -s marketplace/marketplace_password@oracle:1521/FREEPDB1 @/seed/settlement-large.sql
    volumes:
    - ./data/seed-large/oracle:/seed:ro
    depends_on:
      be-settlement-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-mongo-large:
    image: mongo:8.0
    profiles:
    - seed-large
    entrypoint:
    - bash
    - -lc
    - 'set -e

      mongosh ''mongodb://mongo:27017/comment_db?replicaSet=rs0'' /seed/comment-large.js

      mongosh ''mongodb://mongo:27017/notification_db?replicaSet=rs0'' /seed/notification-large.js

      '
    volumes:
    - ./data/seed-large/mongodb:/seed:ro
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      be-comment-api:
        condition: service_healthy
      be-notification-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-opensearch-large:
    image: curlimages/curl:8.12.1
    profiles:
    - seed-large
    entrypoint:
    - sh
    - /seed/seed-large.sh
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_PRODUCT_INDEX: marketplace-products-v1
    volumes:
    - ./infrastructure/opensearch:/seed:ro
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - marketplace
networks:
  marketplace:
    name: marketplace-network
