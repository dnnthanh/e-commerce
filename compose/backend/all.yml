name: e-commerce-marketplace
services:
  backend-runtime-build:
    image: e-commerce-backend-runtime:local
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    pull_policy: build
    entrypoint:
    - /bin/sh
    - -c
    - exit 0
    restart: 'no'
    networks:
    - marketplace
  be-audit-api:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/marketplace
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/token
      SERVICE_CLIENT_ID: marketplace-internal
      SERVICE_CLIENT_SECRET: local-internal-secret
      AUTHORIZATION_BASE_URL: http://be-authorization-api:8080
      AUTHORIZATION_URL: http://be-authorization-api:8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      AUDIT_DB_USER: audit_app
      AUDIT_DB_PASSWORD: audit_password
      SERVER_PORT: '8080'
      DB_URL: jdbc:postgresql://postgres:5432/audit_db
      DB_USERNAME: audit_app
      DB_PASSWORD: audit_password
      SERVICE_MODULE: be-audit-api
      JAVA_OPTS: -Xms64m -Xmx320m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      be-authorization-api:
        condition: service_healthy
    ports:
    - 8100:8080
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 25s
    pull_policy: never
  be-audit-worker:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/marketplace
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/token
      SERVICE_CLIENT_ID: marketplace-internal
      SERVICE_CLIENT_SECRET: local-internal-secret
      AUTHORIZATION_BASE_URL: http://be-authorization-api:8080
      AUTHORIZATION_URL: http://be-authorization-api:8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      AUDIT_DB_USER: audit_app
      AUDIT_DB_PASSWORD: audit_password
      SERVER_PORT: '8080'
      DB_URL: jdbc:postgresql://postgres:5432/audit_db
      DB_USERNAME: audit_app
      DB_PASSWORD: audit_password
      SERVICE_MODULE: be-audit-worker
      JAVA_OPTS: -Xms64m -Xmx224m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      be-audit-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    pull_policy: never
    profiles:
    - full
  be-authorization-api:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
