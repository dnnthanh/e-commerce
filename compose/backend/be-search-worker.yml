name: e-commerce-marketplace
services:
  backend-runtime-build:
    image: e-commerce-backend-runtime:local
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    pull_policy: build
    entrypoint:
    - /bin/sh
    - -c
    - exit 0
    restart: 'no'
    networks:
    - marketplace
  be-search-worker:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_PRODUCT_INDEX: marketplace-products-v1
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000/marketplace-media
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      SERVER_PORT: '8080'
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      REVIEW_API_URL: http://be-review-api:8080
      SERVICE_MODULE: be-search-worker
      JAVA_OPTS: -Xms64m -Xmx224m -XX:+UseSerialGC
    networks:
    - marketplace
    pull_policy: never
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
networks:
  marketplace:
    name: marketplace-network
