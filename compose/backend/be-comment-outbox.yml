name: e-commerce-marketplace
services:
  backend-runtime-build:
    image: e-commerce-backend-runtime:local
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    pull_policy: build
    entrypoint:
    - /bin/sh
    - -c
    - exit 0
    restart: 'no'
    networks:
    - marketplace
  be-comment-outbox:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      COMMENT_MONGODB_URI: mongodb://mongo:27017/comment_db?replicaSet=rs0
      OUTBOX_DELAY_MS: '500'
      SERVER_PORT: '8080'
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      MONGODB_URI: mongodb://mongo:27017/comment_db?replicaSet=rs0
      SERVICE_MODULE: be-comment-outbox
      JAVA_OPTS: -Xms64m -Xmx224m -XX:+UseSerialGC
    networks:
    - marketplace
    pull_policy: never
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
networks:
  marketplace:
    name: marketplace-network
