name: e-commerce-marketplace
services:
  backend-runtime-build:
    image: e-commerce-backend-runtime:local
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    pull_policy: build
    entrypoint:
    - /bin/sh
    - -c
    - exit 0
    restart: 'no'
    networks:
    - marketplace
  be-review-outbox:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/review_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: review_user
      DB_PASSWORD: review_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_DELAY_MS: '500'
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      SERVER_PORT: '8080'
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      SERVICE_MODULE: be-review-outbox
      JAVA_OPTS: -Xms64m -Xmx224m -XX:+UseSerialGC
    networks:
    - marketplace
    pull_policy: never
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
networks:
  marketplace:
    name: marketplace-network
