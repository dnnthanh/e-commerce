      PGPASSWORD=catalog_password psql -h postgres -U catalog -d catalog_db -f /seed/catalog-large.sql

      PGPASSWORD=pricing_password psql -h postgres -U pricing_app -d pricing_db -f /seed/pricing-large.sql

      PGPASSWORD=promotion_password psql -h postgres -U promotion_app -d promotion_db -f /seed/promotion-large.sql

      PGPASSWORD=inventory_password psql -h postgres -U inventory_app -d inventory_db -f /seed/inventory-large.sql

      PGPASSWORD=media_password psql -h postgres -U media_user -d media_db -f /seed/media-large.sql

      PGPASSWORD=operations_password psql -h postgres -U operations_user -d operations_db -f /seed/operations-large.sql

      PGPASSWORD=audit_password psql -h postgres -U audit_app -d audit_db -f /seed/audit-large.sql

      PGPASSWORD=authorization_password psql -h postgres -U authorization_app -d authorization_db -f /seed/authorization-large.sql

      PGPASSWORD=payment_password psql -h postgres -U payment_app -d payment_db -f /seed/payment-large.sql

      PGPASSWORD=checkout_password psql -h postgres -U checkout_app -d checkout_db -f /seed/checkout-large.sql

      PGPASSWORD=return_password psql -h postgres -U return_user -d return_db -f /seed/return-large.sql

      '
    volumes:
    - ./data/seed-large/postgresql:/seed:ro
    depends_on:
      be-catalog-api:
        condition: service_healthy
      be-inventory-api:
        condition: service_healthy
      be-pricing-api:
        condition: service_healthy
      be-audit-api:
        condition: service_healthy
      be-payment-api:
        condition: service_healthy
      be-checkout-api:
        condition: service_healthy
      be-return-api:
        condition: service_healthy
      be-operations-api:
        condition: service_healthy
      be-media-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-mysql-large:
    image: mysql:8.4
    profiles:
    - seed-large
    environment:
      MYSQL_PWD: root_password
    entrypoint:
    - sh
    - -c
    - 'set -e

      mysql -h mysql -uroot -proot_password seller_db < /seed/seller-large.sql

      mysql -h mysql -uroot -proot_password review_db < /seed/review-large.sql

      mysql -h mysql -uroot -proot_password cart_db < /seed/cart-large.sql

      '
    volumes:
    - ./data/seed-large/mysql:/seed:ro
    depends_on:
      be-seller-api:
        condition: service_healthy
      be-review-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-sqlserver-large:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles:
    - seed-large
    environment:
      MSSQL_SA_PASSWORD: Marketplace!2026
    entrypoint:
    - /bin/bash
    - -lc
    - 'set -e

      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d order_db -i /seed/order-large.sql

      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -C -d fulfillment_db -i /seed/fulfillment-large.sql

      '
    volumes:
    - ./data/seed-large/sqlserver:/seed:ro
    depends_on:
      be-order-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-oracle-large:
    image: gvenzl/oracle-free:23-slim-faststart
    profiles:
    - seed-large
    entrypoint:
    - /bin/bash
    - -lc
    - echo exit | sqlplus -s marketplace/marketplace_password@oracle:1521/FREEPDB1 @/seed/settlement-large.sql
    volumes:
    - ./data/seed-large/oracle:/seed:ro
    depends_on:
      be-settlement-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-mongo-large:
    image: mongo:8.0
    profiles:
    - seed-large
    entrypoint:
    - bash
    - -lc
    - 'set -e

      mongosh ''mongodb://mongo:27017/comment_db?replicaSet=rs0'' /seed/comment-large.js

      mongosh ''mongodb://mongo:27017/notification_db?replicaSet=rs0'' /seed/notification-large.js

      '
    volumes:
    - ./data/seed-large/mongodb:/seed:ro
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      be-comment-api:
        condition: service_healthy
      be-notification-api:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  seed-opensearch-large:
    image: curlimages/curl:8.12.1
    profiles:
    - seed-large
    entrypoint:
    - sh
    - /seed/seed-large.sh
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      OPENSEARCH_PRODUCT_INDEX: marketplace-products-v1
    volumes:
    - ./infrastructure/opensearch:/seed:ro
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    restart: 'no'
    networks:
    - marketplace
  storefront:
    image: e-commerce-storefront:local
    build:
      context: ./frontend
      dockerfile: Dockerfile.storefront
    environment:
      API_BASE_URL: http://localhost:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_CLIENT_ID: storefront
    ports:
    - 4200:80
    depends_on:
      be-gateway:
        condition: service_healthy
      seed-opensearch-demo:
        condition: service_completed_successfully
    networks:
    - marketplace
    pull_policy: build
  admin:
    image: e-commerce-admin:local
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
    environment:
      API_BASE_URL: http://localhost:8080
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_CLIENT_ID: admin-console
    ports:
    - 4201:80
    depends_on:
      be-gateway:
        condition: service_healthy
    networks:
    - marketplace
    pull_policy: build
  lgtm:
    image: grafana/otel-lgtm:0.29.2
    ports:
    - 3000:3000
    - 9090:9090
    - 3100:3100
    - 3200:3200
    - 4317:4317
    - 4318:4318
    - 4040:4040
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
      PROMETHEUS_EXTRA_ARGS: --storage.tsdb.retention.time=15d
    volumes:
    - ./infrastructure/lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
    - ./infrastructure/prometheus/rules:/otel-lgtm/prometheus-rules:ro
    - ./infrastructure/prometheus/targets:/otel-lgtm/prometheus-targets:ro
    - ./infrastructure/grafana/provisioning/dashboards/dashboards.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/marketplace.yml:ro
    - ./infrastructure/grafana/dashboards:/otel-lgtm/grafana/dashboards/marketplace:ro
    - lgtm-data:/data
    networks:
    - marketplace
    profiles:
    - observability
  alertmanager:
    image: prom/alertmanager:v0.32.1
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
    - 9093:9093
    volumes:
    - ./infrastructure/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
    - marketplace
    profiles:
    - observability
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
    - --kafka.server=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  kafka-jmx-exporter:
    build:
      context: ./infrastructure/kafka/jmx-exporter
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: marketplace_admin
      DATA_SOURCE_PASS: marketplace_admin_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  mysql-exporter:
    image: prom/mysqld-exporter:v0.19.0
    command:
    - --config.my-cnf=/cfg/.my.cnf
    volumes:
    - ./infrastructure/mysql/exporter/.my.cnf:/cfg/.my.cnf:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  mongodb-exporter:
    image: percona/mongodb_exporter:0.51.0
    command:
    - --mongodb.uri=mongodb://mongo:27017/admin?replicaSet=rs0
    - --collect-all
    depends_on:
      mongo:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - full
  redis-exporter:
    image: oliver006/redis_exporter:v1.84.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  mssql-exporter:
    image: awaragi/prometheus-mssql-exporter:v1.3.0
    environment:
      SERVER: sqlserver
      PORT: '1433'
      USERNAME: sa
      PASSWORD: Marketplace!2026
      ENCRYPT: 'true'
      TRUST_SERVER_CERTIFICATE: 'true'
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  oracle-exporter:
    image: container-registry.oracle.com/database/observability-exporter:2.4.2
    pull_policy: missing
    command:
      - --config.file=/config/config.yaml
    volumes:
      - ./infrastructure/oracle-exporter/config.yaml:/config/config.yaml:ro
    depends_on:
      oracle:
        condition: service_healthy
    networks:
      - marketplace
    profiles:
      - full
  opensearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    command:
    - --es.uri=http://opensearch:9200
    - --es.all
    - --es.indices
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    devices:
    - /dev/kmsg:/dev/kmsg
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker:/var/lib/docker:ro
    networks:
    - marketplace
    profiles:
    - observability
  node-exporter:
    image: prom/node-exporter:v1.11.1
    command:
    - --path.procfs=/host/proc
    - --path.sysfs=/host/sys
    - --path.rootfs=/rootfs
    - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
    - /proc:/host/proc:ro
    - /sys:/host/sys:ro
    - /:/rootfs:ro
    networks:
    - marketplace
    profiles:
    - observability
  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    command:
    - --config.file=/config/blackbox.yml
    volumes:
    - ./infrastructure/blackbox/blackbox.yml:/config/blackbox.yml:ro
    networks:
    - marketplace
    profiles:
    - observability
volumes:
  postgres-data: {}
  mysql-data: {}
  sqlserver-data: {}
  oracle-data: {}
  mongo-data: {}
  redis-data: {}
  kafka-data: {}
  opensearch-data: {}
  minio-data: {}
  cloudbeaver-data: {}
  lgtm-data: {}
networks:
  marketplace:
    name: marketplace-network
