name: e-commerce-marketplace
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: marketplace_admin
      POSTGRES_PASSWORD: marketplace_admin_password
      POSTGRES_DB: postgres
    ports:
    - 5432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U marketplace_admin -d postgres]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
    - marketplace
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    ports:
    - 3306:3306
    volumes:
    - mysql-data:/var/lib/mysql
    - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h 127.0.0.1 -uroot -proot_password --silent]
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
    - marketplace
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: Marketplace!2026
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: '1536'
    ports:
    - 1433:1433
    volumes:
    - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" >/dev/null || exit 1]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 20s
    networks:
    - marketplace
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: Marketplace!2026
    entrypoint:
    - /bin/bash
    - /init/run-init.sh
    volumes:
    - ./infrastructure/sqlserver/init:/init:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle_password
      APP_USER: marketplace
      APP_USER_PASSWORD: marketplace_password
    ports:
    - 1521:1521
    volumes:
    - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: [CMD, healthcheck.sh]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    networks:
    - marketplace
    profiles:
    - heavy
    - full
    - seed-large
  mongo:
    image: mongo:8.0
    command:
    - mongod
    - --replSet
    - rs0
    - --bind_ip_all
    ports:
    - 27017:27017
    volumes:
    - mongo-data:/data/db
    healthcheck:
      test: [CMD-SHELL, 'mongosh --quiet --eval "db.adminCommand({ping:1}).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 40
    networks:
    - marketplace
    profiles:
    - full
    - seed-large
  mongo-init:
    image: mongo:8.0
    entrypoint:
    - bash
    - -lc
    - mongosh --host mongo:27017 /init/init-replica.js && until mongosh --host mongo:27017 --quiet --eval "rs.status().myState" | grep -q 1; do sleep 2; done
    volumes:
    - ./infrastructure/mongodb/init:/init:ro
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
    profiles:
    - full
    - seed-large
  redis:
    image: redis:7.4-alpine
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 6379:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
    - marketplace
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_JMX_PORT: '9999'
      KAFKA_JMX_HOSTNAME: kafka
      KAFKA_JMX_OPTS: -Djava.rmi.server.hostname=kafka -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
    - 29092:29092
    volumes:
    - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1']
      interval: 10s
      timeout: 10s
      retries: 40
    networks:
    - marketplace
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
    - 8185:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: marketplace
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
    - 9200:9200
    volumes:
    - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9200/_cluster/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 40
    networks:
    - marketplace
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    ports:
    - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
    - marketplace
    profiles:
    - observability
  opensearch-init:
    image: curlimages/curl:8.12.1
    entrypoint:
    - sh
    - -c
    - 'curl -fsS -XPUT -H "Content-Type: application/json" --data-binary @/config/product-index-template.json http://opensearch:9200/_index_template/marketplace-products
      && curl -fsS -XPUT http://opensearch:9200/marketplace-products-v1 || true'
    volumes:
    - ./infrastructure/opensearch/product-index-template.json:/config/product-index-template.json:ro
    depends_on:
      opensearch:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  minio:
    image: quay.io/minio/minio:latest
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: marketplace
      MINIO_ROOT_PASSWORD: marketplace-secret
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio-data:/data
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
    - marketplace
  imgproxy:
    image: darthsim/imgproxy:latest
    ports:
    - 8186:8080
    environment:
      IMGPROXY_BIND: 0.0.0.0:8080
      IMGPROXY_USE_S3: 'true'
      AWS_ACCESS_KEY_ID: marketplace
      AWS_SECRET_ACCESS_KEY: marketplace-secret
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    networks:
    - marketplace
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command:
    - start-dev
    - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8180
      JAVA_OPTS_APPEND: -Xms128m -Xmx384m
    ports:
    - 8180:8080
    volumes:
    - ./infrastructure/keycloak/realm-marketplace.json:/opt/keycloak/data/import/realm-marketplace.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, bash -c "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 20s
    networks:
    - marketplace
  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.7.0
    entrypoint:
    - /bin/bash
    - /bootstrap/bootstrap-internal-client.sh
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_REALM: marketplace
      SERVICE_CLIENT_ID: marketplace-internal
    volumes:
    - ./infrastructure/keycloak:/bootstrap:ro
    depends_on:
      keycloak:
        condition: service_healthy
    restart: 'no'
    networks:
    - marketplace
  alloy:
    image: grafana/alloy:v1.18.0
    command:
    - run
    - /etc/alloy/config.alloy
    - --server.http.listen-addr=0.0.0.0:12345
    ports:
    - 12345:12345
    volumes:
    - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      lgtm:
        condition: service_started
    networks:
    - marketplace
    profiles:
    - observability
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    ports:
    - 8978:8978
    volumes:
    - cloudbeaver-data:/opt/cloudbeaver/workspace
    networks:
    - marketplace
    profiles:
    - observability
  backend-runtime-build:
    image: e-commerce-backend-runtime:local
    build:
      context: ./backend
      dockerfile: Dockerfile.runtime
    pull_policy: build
    entrypoint:
    - /bin/sh
    - -c
    - exit 0
    restart: 'no'
    networks:
    - marketplace
  be-audit-api:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/marketplace
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/token
      SERVICE_CLIENT_ID: marketplace-internal
      SERVICE_CLIENT_SECRET: local-internal-secret
      AUTHORIZATION_BASE_URL: http://be-authorization-api:8080
      AUTHORIZATION_URL: http://be-authorization-api:8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      AUDIT_DB_USER: audit_app
      AUDIT_DB_PASSWORD: audit_password
      SERVER_PORT: '8080'
      DB_URL: jdbc:postgresql://postgres:5432/audit_db
      DB_USERNAME: audit_app
      DB_PASSWORD: audit_password
      SERVICE_MODULE: be-audit-api
      JAVA_OPTS: -Xms64m -Xmx320m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      be-authorization-api:
        condition: service_healthy
    ports:
    - 8100:8080
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 25s
    pull_policy: never
  be-audit-worker:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/marketplace
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/token
      SERVICE_CLIENT_ID: marketplace-internal
      SERVICE_CLIENT_SECRET: local-internal-secret
      AUTHORIZATION_BASE_URL: http://be-authorization-api:8080
      AUTHORIZATION_URL: http://be-authorization-api:8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      AUDIT_DB_USER: audit_app
      AUDIT_DB_PASSWORD: audit_password
      SERVER_PORT: '8080'
      DB_URL: jdbc:postgresql://postgres:5432/audit_db
      DB_USERNAME: audit_app
      DB_PASSWORD: audit_password
      SERVICE_MODULE: be-audit-worker
      JAVA_OPTS: -Xms64m -Xmx224m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      be-audit-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    pull_policy: never
    profiles:
    - full
  be-authorization-api:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/marketplace
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/token
      SERVICE_CLIENT_ID: marketplace-internal
      SERVICE_CLIENT_SECRET: local-internal-secret
      AUTHORIZATION_BASE_URL: http://be-authorization-api:8080
      AUTHORIZATION_URL: http://be-authorization-api:8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      SERVER_PORT: '8080'
      KEYCLOAK_REALM: marketplace
      KEYCLOAK_ADMIN_CLIENT_ID: authorization-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: authorization-admin-secret
      DB_URL: jdbc:postgresql://postgres:5432/authorization_db
      DB_USERNAME: authorization_app
      DB_PASSWORD: authorization_password
      SERVICE_MODULE: be-authorization-api
      JAVA_OPTS: -Xms64m -Xmx320m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
    ports:
    - 8081:8080
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 25s
    pull_policy: never
  be-cart-api:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/marketplace
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/token
      SERVICE_CLIENT_ID: marketplace-internal
      SERVICE_CLIENT_SECRET: local-internal-secret
      AUTHORIZATION_BASE_URL: http://be-authorization-api:8080
      AUTHORIZATION_URL: http://be-authorization-api:8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      DB_USERNAME: marketplace
      DB_PASSWORD: marketplace_password
      SERVER_PORT: '8080'
      DB_URL: jdbc:mysql://mysql:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      CATALOG_BASE_URL: http://be-catalog-api:8080
      PRICING_BASE_URL: http://be-pricing-api:8080
      INVENTORY_BASE_URL: http://be-inventory-api:8080
      SERVICE_MODULE: be-cart-api
      JAVA_OPTS: -Xms64m -Xmx320m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      be-authorization-api:
        condition: service_healthy
    ports:
    - 8089:8080
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 25s
    pull_policy: never
  be-catalog-api:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      TRACING_SAMPLING: ${TRACING_SAMPLING:-0.0}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/marketplace
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/token
      SERVICE_CLIENT_ID: marketplace-internal
      SERVICE_CLIENT_SECRET: local-internal-secret
      AUTHORIZATION_BASE_URL: http://be-authorization-api:8080
      AUTHORIZATION_URL: http://be-authorization-api:8080
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      CATALOG_DB_USER: catalog
      CATALOG_DB_PASSWORD: catalog_password
      MEDIA_BASE_URL: http://be-media-api:8080
      SERVER_PORT: '8080'
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog
      DB_PASSWORD: catalog_password
      SERVICE_MODULE: be-catalog-api
      JAVA_OPTS: -Xms64m -Xmx320m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      be-authorization-api:
        condition: service_healthy
      be-media-api:
        condition: service_healthy
    ports:
    - 8083:8080
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/actuator/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 25s
    pull_policy: never
  be-catalog-outbox:
    image: e-commerce-backend-runtime:local
    restart: unless-stopped
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      CATALOG_DB_USER: catalog
      CATALOG_DB_PASSWORD: catalog_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OUTBOX_DELAY_MS: '500'
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://lgtm:4318/v1/traces
      SERVER_PORT: '8080'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/marketplace
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/marketplace/protocol/openid-connect/certs
      DB_URL: jdbc:postgresql://postgres:5432/catalog_db
      DB_USERNAME: catalog
      DB_PASSWORD: catalog_password
      MEDIA_BASE_URL: http://be-media-api:8080
      SERVICE_MODULE: be-catalog-outbox
      JAVA_OPTS: -Xms64m -Xmx224m -XX:+UseSerialGC
    networks:
    - marketplace
    depends_on:
      backend-runtime-build:
        condition: service_completed_successfully
      be-catalog-api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    pull_policy: never
    profiles:
