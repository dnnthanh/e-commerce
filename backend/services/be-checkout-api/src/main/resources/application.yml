spring:
  application:
    name: be-checkout-api
  main:
    web-application-type: servlet
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      properties:
        spring.json.trusted.packages: com.dnnthanh.marketplace.be.*
        spring.json.use.type.headers: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
    producer:
      properties:
        spring.json.add.type.headers: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: schema
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT}
logging:
  structured:
    format:
      console: ecs

checkout:
  remote:
    inventory-base-url: ${INVENTORY_BASE_URL}
    pricing-base-url: ${PRICING_BASE_URL}
    promotion-base-url: ${PROMOTION_BASE_URL}
    order-base-url: ${ORDER_BASE_URL}
    payment-base-url: ${PAYMENT_BASE_URL}

  remote-resilience:
    sliding-window-size: ${CHECKOUT_CB_WINDOW:20}
    minimum-number-of-calls: ${CHECKOUT_CB_MIN_CALLS:10}
    failure-rate-threshold: ${CHECKOUT_CB_FAILURE_RATE:50}
    wait-duration-in-open-state: ${CHECKOUT_CB_OPEN_WAIT:10s}
    permitted-number-of-calls-in-half-open-state: ${CHECKOUT_CB_HALF_OPEN_CALLS:3}
    max-concurrent-calls: ${CHECKOUT_BULKHEAD_MAX_CALLS:30}
    max-wait-duration: ${CHECKOUT_BULKHEAD_MAX_WAIT:0ms}

marketplace:
  internal-security:
    token-uri: ${KEYCLOAK_TOKEN_URI}
    client-id: ${SERVICE_CLIENT_ID}
    client-secret: ${SERVICE_CLIENT_SECRET}
    authorization-base-url: ${AUTHORIZATION_BASE_URL}
