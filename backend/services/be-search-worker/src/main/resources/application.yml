spring:
  application:
    name: be-search-worker
  main:
    web-application-type: reactive
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      properties:
        spring.json.trusted.packages: com.dnnthanh.marketplace.be.*
        spring.json.use.type.headers: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
    producer:
      properties:
        spring.json.add.type.headers: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI}
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT}
logging:
  structured:
    format:
      console: ecs
opensearch:
  url: ${OPENSEARCH_URL}
  index: ${OPENSEARCH_PRODUCT_INDEX:marketplace-products-v1}
clients:
  review: ${REVIEW_API_URL}
