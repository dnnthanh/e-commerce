name: storefront-visual-evidence

on:
  push:
    branches: ['feature/**', 'fix/**']
    paths:
      - 'frontend/**'
      - 'infrastructure/keycloak/**'
      - 'compose/infrastructure.yml'
      - 'docker-compose.yml'
      - '.github/workflows/storefront-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build storefront
        working-directory: frontend
        run: npm run build:storefront
      - name: Start Keycloak fixture
        run: docker compose up -d postgres keycloak
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Wait for Keycloak realm
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8180/realms/marketplace/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo 'Keycloak realm did not become ready in time' >&2
          docker compose logs --no-color --tail=300 keycloak
          exit 1
      - name: Run Playwright and capture screenshots
        working-directory: frontend
        run: npm run test:ui
      - name: Upload screenshots and Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storefront-playwright-visuals
          if-no-files-found: warn
          path: |
            frontend/playwright-artifacts
            frontend/playwright-report
            frontend/test-results
      - name: Stop Keycloak fixture
        if: always()
        run: docker compose down --remove-orphans -v
