name: storefront-real-data-visual

on:
  workflow_dispatch:
  push:
    branches: [fix/storefront-visual-runtime]
  pull_request:
    branches: [develop, master]
    paths:
      - 'frontend/**'
      - 'backend/services/be-catalog-api/**'
      - 'backend/services/be-media-api/**'
      - 'backend/services/be-pricing-api/**'
      - 'backend/services/be-review-api/**'
      - 'backend/services/be-comment-api/**'
      - 'backend/services/be-gateway/**'
      - 'compose/**'
      - 'data/seed-demo/**'
      - 'infrastructure/media-seed/**'
      - '.github/workflows/storefront-visual.yml'

permissions:
  contents: read

concurrency:
  group: storefront-real-data-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-data-visual:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          package-manager-cache: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start real storefront infrastructure
        run: |
          set -euo pipefail
          docker compose up -d postgres mysql mongo mongo-init redis kafka keycloak minio

      - name: Build backend runtime and media seed
        run: docker compose build backend-runtime-build media-seed

      - name: Bootstrap Keycloak internal client
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            id=$(docker compose ps -q keycloak)
            if [ -n "$id" ]; then
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")
              echo "keycloak=$status"
              if [ "$status" = healthy ]; then
                break
              fi
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose logs --no-color --tail=300 keycloak
              exit 1
            fi
            sleep 5
          done
          docker compose run --rm --no-deps keycloak-bootstrap

      - name: Start real storefront backend slice only
        run: |
          set -euo pipefail
          # The hosted runner can already have 8084 occupied. The visual test never
          # calls Media directly from the host, so publish its container port on an
          # ephemeral host port while keeping be-media-api:8080 unchanged internally.
          python - <<'PY'
          from pathlib import Path

          compose = Path('docker-compose.yml')
          content = compose.read_text()
          fixed_media_port = '    - 8084:8080\n'
          if content.count(fixed_media_port) != 1:
              raise SystemExit('Expected exactly one be-media-api host port mapping')
          compose.write_text(content.replace(fixed_media_port, '    - "8080"\n'))
          PY

          services=(
            be-authorization-api
            be-catalog-api
            be-media-api
            be-pricing-api
            be-review-api
            be-comment-api
            be-gateway
          )
          for service in "${services[@]}"; do
            docker compose up -d --no-deps "$service"
          done

      - name: Wait for storefront backend slice
        shell: bash
        run: |
          set -euo pipefail
          services=(be-authorization-api be-catalog-api be-media-api be-pricing-api be-review-api be-comment-api be-gateway)
          for attempt in $(seq 1 80); do
            unhealthy=0
            for service in "${services[@]}"; do
              id=$(docker compose ps -q "$service")
              if [ -z "$id" ]; then
                unhealthy=1
                continue
              fi
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")
              echo "$service=$status"
              if [ "$status" != healthy ]; then
                unhealthy=1
              fi
            done
            if [ "$unhealthy" -eq 0 ]; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          exit 1

      - name: Seed real Catalog Pricing and Media metadata
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps --entrypoint sh seed-postgres-demo -c '
            set -e
            PGPASSWORD=catalog_password psql -h postgres -U catalog -d catalog_db -f /seed/catalog.sql
            PGPASSWORD=pricing_password psql -h postgres -U pricing_app -d pricing_db -f /seed/pricing.sql
            PGPASSWORD=media_password psql -h postgres -U media_user -d media_db -f /seed/media.sql
          '

      - name: Materialize real media binaries in MinIO
        run: docker compose run --rm --no-deps media-seed

      - name: Verify Media metadata resolves to a real MinIO object
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://localhost:9000/marketplace-media/seed/products/1001/home-480.avif -o /tmp/product-1001.avif
          test -s /tmp/product-1001.avif
          curl -fsS http://localhost:8080/media/products/1001/assets -o /tmp/media.json
          python - <<'PY'
          import json
          from pathlib import Path
          assets = json.loads(Path('/tmp/media.json').read_text())
          assert len(assets) >= 4, assets
          urls = [item['url'] for item in assets]
          assert any(url.startswith('http://localhost:9000/marketplace-media/seed/products/1001/') for url in urls), urls
          print('REAL_MEDIA_URLS_OK', len(urls))
          PY

      - name: Run Playwright against real demo APIs and MinIO
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:ui

      - name: Upload real storefront screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storefront-real-data-visuals
          if-no-files-found: warn
          retention-days: 14
          path: |
            frontend/playwright-artifacts
            frontend/playwright-report
            frontend/test-results

      - name: Capture real-stack logs on failure
        if: failure()
        run: |
          mkdir -p visual-ci-logs
          docker compose ps -a > visual-ci-logs/compose-ps.txt || true
          for service in postgres mysql mongo redis kafka keycloak minio be-authorization-api be-catalog-api be-media-api be-pricing-api be-review-api be-comment-api be-gateway; do
            docker compose logs --no-color --tail=400 "$service" > "visual-ci-logs/${service}.log" 2>&1 || true
            id=$(docker compose ps -aq "$service" | head -n 1)
            if [ -n "$id" ]; then
              docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' "$id" > "visual-ci-logs/${service}.state.txt" 2>&1 || true
            fi
          done

      - name: Upload real-stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: storefront-real-data-visual-diagnostics
          path: visual-ci-logs

      - name: Stop real storefront stack
        if: always()
        run: docker compose down --remove-orphans -v
