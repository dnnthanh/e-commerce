name: marketplace-ci

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master, 'feature/**', 'fix/**', 'chore/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check PyYAML Pillow
      - name: Keycloak authority contract
        run: python verification/verify_keycloak_authority_v17.py
      - name: Existing project verification gates
        shell: bash
        run: |
          set -euo pipefail
          for script in verification/verify_*.py; do
            echo "==> $script"
            python "$script"
          done

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Backend unit tests and package
        run: ./mvnw -f backend/pom.xml -B -ntp clean verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.3'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build storefront
        run: npm run build:storefront
      - name: Build admin
        run: npm run build:admin

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate default Compose topology
        run: docker compose config --quiet
      - name: Validate full/heavy/observability topology
        run: docker compose --profile full --profile heavy --profile observability config --quiet

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PARALLEL_LIMIT: '2'
    steps:
      - uses: actions/checkout@v7
      - name: Build backend runtime image
        run: docker compose build backend-runtime-build
      - name: Build storefront image
        run: docker compose build storefront
      - name: Build admin image
        run: docker compose build admin
      - name: Build media seed image
        run: docker compose build media-seed
      - name: Build Kafka JMX exporter image
        run: docker compose build kafka-jmx-exporter

  core-infrastructure-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start core infrastructure
        run: docker compose up -d postgres redis kafka keycloak opensearch
      - name: Wait for core health
        shell: bash
        run: |
          set -euo pipefail
          services=(postgres redis kafka keycloak opensearch)
          for attempt in $(seq 1 60); do
            unhealthy=0
            for service in "${services[@]}"; do
              id=$(docker compose ps -q "$service")
              if [ -z "$id" ]; then
                unhealthy=1
                continue
              fi
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id")
              echo "$service=$status"
              if [ "$status" != healthy ] && [ "$status" != running ]; then
                unhealthy=1
              fi
            done
            if [ "$unhealthy" -eq 0 ]; then
              exit 0
            fi
            sleep 5
          done
          echo 'Core infrastructure did not become healthy in time' >&2
          docker compose ps
          exit 1
      - name: Capture Compose logs on failure
        if: failure()
        run: |
          mkdir -p ci-logs
          docker compose ps > ci-logs/compose-ps.txt || true
          for service in postgres redis kafka keycloak opensearch; do
            docker compose logs --no-color --tail=500 "$service" > "ci-logs/${service}.log" 2>&1 || true
          done
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-infrastructure-logs
          path: ci-logs
      - name: Stop infrastructure
        if: always()
        run: docker compose down --remove-orphans -v
