global:
  resolve_timeout: 5m

route:
  receiver: local-log
  group_by: [alertname, job, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-log

# Local development intentionally has no external notification credentials.
# Production receivers (email/Slack/Telegram/etc.) are environment-specific.
